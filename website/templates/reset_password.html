{% extends "base.html" %} 
{% block title %}Set New Password - GyanBarter{% endblock %} 

{% block content %}
<style>
    :root {
        --intel-purple: #3a1b5d;
        --intel-orange: #f39c12;
    }

    body { background-color: #ffffff; font-family: 'Open Sans', sans-serif; }

    .auth-banner {
        background-color: var(--intel-purple);
        color: white;
        padding: 25px 0;
        margin-bottom: 40px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .auth-banner h1 { font-weight: 700; font-size: 28px; max-width: 1100px; margin: 0 auto; padding: 0 20px; }

    .main-wrapper { max-width: 1150px; margin: 0 auto; display: flex; flex-wrap: wrap; padding: 20px 20px 80px 20px; }

    .left-side { flex: 1; padding-right: 60px; border-right: 1px solid #eeeeee; }
    .left-side h5 { font-size: 20px; font-weight: 700; color: var(--intel-purple); margin-bottom: 15px; }

    .right-side { flex: 2; padding-left: 60px; }
    .form-label { font-size: 14px; color: #555; font-weight: 600; margin-bottom: 8px; display: block; }

    .input-box {
        border: 1px solid #cccccc;
        border-radius: 4px;
        padding: 12px;
        margin-bottom: 20px;
        width: 100%;
        display: block;
    }

    .btn-submit {
        background-color: var(--intel-orange);
        color: white;
        border: none;
        padding: 14px 70px;
        font-size: 16px;
        font-weight: 700;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
    }
</style>

<div class="auth-banner">
    <h1>Set New Password</h1>
</div>

<div class="main-wrapper">
    <div class="left-side">
        <h5>Choose a strong password</h5>
        <p>Make sure your new password is at least 8 characters long and includes numbers or symbols for better security.</p>
    </div>

    <div class="right-side">
        <form method="POST">
            <label class="form-label">New Password</label>
            <input type="password" name="password" class="input-box" required>

            <label class="form-label">Confirm New Password</label>
            <input type="password" name="confirm_password" class="input-box" required>

            <button type="submit" class="btn-submit">Update Password</button>
        </form>
    </div>
</div>
{% endblock %}
