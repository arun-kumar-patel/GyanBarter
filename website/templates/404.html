{% extends "base.html" %}
{% block title %}Page Not Found - 404{% endblock %}

{% block content %}

<style>
    nav, .navbar, header, footer {
        display: none !important;
    }
    
    body { 
        padding-top: 0 !important; 
        background-color: #f8f9fa;
    }
</style>

<div class="container d-flex flex-column justify-content-center align-items-center text-center" style="min-height: 100vh;">
    
    <div class="mb-4 text-secondary" style="font-size: 8rem; opacity: 0.2;">
        <i class="fas fa-map-signs fa-bounce" style="--fa-animation-duration: 3s;"></i>
    </div>
    
    <h1 class="display-1 fw-bold text-success" style="letter-spacing: -5px;">404</h1>
    <h2 class="mb-3 text-dark fw-bold">Oops! You seem lost.</h2>
    
    <p class="lead text-muted mb-5" style="max-width: 500px;">
        The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
    </p>
    
    <div>
        <a href="javascript:history.back()" class="btn btn-dark btn-lg rounded-pill px-5 shadow-lg fw-bold">
            <i class="fas fa-arrow-left me-2"></i> Go Back
        </a>
    </div>

</div>

{% endblock %}
